name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write
    defaults:
      run:
        working-directory: packages/status-page
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # A tag that disagrees with package.json would publish the wrong version.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, test, and build. No token: npm trusted
      # publishing authenticates this workflow through the OIDC id-token, so
      # the package settings on npmjs.com must list this repo and file.
      - run: npm publish --provenance --access public
